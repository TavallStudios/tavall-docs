rules:
  - An individual signal routes to its owning chapter; combine chapters only when distinct concerns are actually present.
  - For Tavall DI, Database, Registry, Cache, and other canonical tool API/access behavior, consult the owning tool's current checked-in access guide after routing to the relevant shared architecture chapter; shared docs must not duplicate tool internals.
  - Simple records are direct value construction; do not route them through a DataBuilder unless the task also involves meaningful builder options/defaults/assembly.
  - Do not load docs/quality/README.md as policy unless the user explicitly asks for the documentation index.
  - Do not load CODE_ARCHITECTURE.md merely because source code is being changed.
  - A detailed chapter may be selected without also loading CODE_ARCHITECTURE.md.
  - When one matched signal's whole-word span is fully contained inside another matched signal's span, only the longer declared signal contributes routes for that span; non-overlapping matches still union their routes.
  - If equally specific matching signals select different routes, union those routes and deduplicate their documents.
  - Load a document template only when creating or materially restructuring that document type.
  - Repository-local AGENTS.md or AGENT.MD remains an instruction source, not a reason to recursively read repository documentation.
  - Repository-local system, design, progression, operating, or migration documents are selected only when the touched system or explicit prompt makes them relevant.
