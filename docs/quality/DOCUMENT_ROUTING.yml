version: 1

source:
  repository: TavallStudios/tavall-docs
  branch: main
  root: docs/quality

matching:
  explicit_document_path_precedence: true
  case_sensitive: false
  mode: exact_whole_term_or_phrase
  fuzzy_matching: false
  recursive_fallback: false
  reasoning_labels_must_match_declared_signal: true
  overlapping_signal_precedence: longest_declared_signal_span
  equal_specificity_routes: union

resolution:
  order:
    - explicit_document_path_or_filename
    - exact_user_prompt_signal
    - exact_agent_reasoning_signal
    - targeted_filename_or_heading_search
  on_no_match: surface_unresolved_documentation_context
  deduplicate_documents: true
  reread_when:
    - selected_document_changes
    - task_scope_adds_new_routed_concern
    - user_explicitly_changes_required_documentation
  do_not_reread_on_branch_head_change_alone: true

